<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2e2a">
  <title>Guia de Pesquisa — Projeto em Ação</title>
  <meta name="description" content="Guia de Pesquisa — Projeto em Ação">
  <style>
    :root{color-scheme:light;--bg:#f4f7f5;--ink:#17312d;--brand:#0b5d52;--line:#dce7e3}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
    .shell{height:100%;display:grid;grid-template-rows:auto 1fr}
    header{min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px;box-shadow:0 1px 6px #0000000a;z-index:2}
    .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800}
    .title{min-width:0;flex:1}.title strong{display:block;font-size:15px;line-height:1.2}.title span{display:block;font-size:12px;opacity:.66;margin-top:2px}
    .open{border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;padding:10px 14px;text-decoration:none;white-space:nowrap}
    .stage{position:relative;min-height:0;background:#fff}
    iframe{width:100%;height:100%;border:0;background:#fff}
    .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:28px;background:var(--bg);text-align:center}
    .card{max-width:560px;background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 34px #17312d12}
    .card h1{font-size:25px;margin:0 0 10px}.card p{line-height:1.55;margin:0 0 18px;opacity:.8}
    @media(max-width:640px){header{padding:8px 10px}.title span{display:none}.open{padding:9px 11px;font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark">P</div>
      <div class="title"><strong>Guia de Pesquisa — Projeto em Ação</strong><span>Versão publicada via GitHub Pages</span></div>
      <a class="open" href="https://script.google.com/macros/s/AKfycbyXJr1LRqzJmHjV60TDKE9nuV-oQXmneQwconqIdE7GBDyPEK2chJQpd2Ykpb0uBx2i/exec" target="_blank" rel="noopener">Abrir original</a>
    </header>
    <section class="stage">
      <iframe id="app" src="https://script.google.com/macros/s/AKfycbyXJr1LRqzJmHjV60TDKE9nuV-oQXmneQwconqIdE7GBDyPEK2chJQpd2Ykpb0uBx2i/exec" title="Guia de Pesquisa — Projeto em Ação" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="fallback" id="fallback">
        <div class="card">
          <h1>Guia de Pesquisa — Projeto em Ação</h1>
          <p>O navegador bloqueou a exibição incorporada do aplicativo original. Use o botão abaixo para abrir a versão ativa.</p>
          <a class="open" href="https://script.google.com/macros/s/AKfycbyXJr1LRqzJmHjV60TDKE9nuV-oQXmneQwconqIdE7GBDyPEK2chJQpd2Ykpb0uBx2i/exec" target="_blank" rel="noopener">Abrir o sistema</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    const frame=document.getElementById('app');
    const fallback=document.getElementById('fallback');
    let loaded=false;
    frame.addEventListener('load',()=>{loaded=true;});
    setTimeout(()=>{if(!loaded) fallback.style.display='flex';},7000);
  </script>
</body>
</html>
